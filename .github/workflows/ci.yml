name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.22.0
  DATABASE_URL: postgresql://orbit:orbit@localhost:5432/orbit_test?schema=public
  REDIS_URL: redis://localhost:6379
  JWT_ACCESS_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
  CORS_ORIGINS: http://localhost:5173
  WEB_APP_URL: http://localhost:5173
  UPLOAD_DIR: ./data/test-uploads
  EXPOSE_API_DOCS: 'false'
  LOG_LEVEL: silent

jobs:
  quality:
    name: Quality and integration gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@orbit/api

      - name: Build shared package for Prisma seed
        run: npm run build --workspace=@orbit/shared

      - name: Apply test database migrations
        run: npm run prisma:deploy --workspace=@orbit/api

      - name: Seed test database roles
        run: npm exec --workspace=@orbit/api prisma db seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Formatting
        run: npm run format:check

      - name: Dependency vulnerability gate
        run: npm audit --audit-level=high

  browser:
    name: Browser and accessibility gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit
          POSTGRES_PASSWORD: orbit
          POSTGRES_DB: orbit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbit -d orbit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=@orbit/api

      - name: Build shared package for Prisma seed
        run: npm run build --workspace=@orbit/shared

      - name: Apply test database migrations
        run: npm run prisma:deploy --workspace=@orbit/api

      - name: Seed test database roles
        run: npm exec --workspace=@orbit/api prisma db seed

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  containers:
    name: Production container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example config --quiet

      - name: Build production images
        run: COMPOSE_PARALLEL_LIMIT=1 docker compose --env-file .env.production.example build api worker web migrate seed

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
