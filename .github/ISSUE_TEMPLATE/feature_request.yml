name: Feature request
description: Propose a product or engineering improvement.
title: '[Feature]: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become possible and how would success be measured?
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security, tenancy, and accessibility considerations
      description: Note affected roles, organizations, data, files, realtime behavior, keyboard access, or localization.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
