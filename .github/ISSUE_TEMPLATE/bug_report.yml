name: Bug report
description: Report a reproducible non-security problem.
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities or include secrets/private data here. Use GitHub private vulnerability reporting for security issues.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence using synthetic data.
      placeholder: "1. Sign in as...\n2. Open...\n3. Select..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Web interface
        - API
        - Realtime
        - Database or migration
        - Docker or deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, browser, and Docker version when relevant. Remove private paths and secrets.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, private user data, and sensitive logs.
          required: true
        - label: This is not a vulnerability report.
          required: true
