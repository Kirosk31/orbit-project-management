<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Archivo (Latin) is the UI font; fetch it with the HTML instead of after the CSS. -->
    <link
      rel="preload"
      href="../../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orbit — the project management platform that keeps your work in orbit. Plan, track, and ship."
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e141f" />
    <meta property="og:title" content="Orbit — Plan. Track. Ship." />
    <meta
      property="og:description"
      content="The project management platform that keeps your work in orbit."
    />
    <meta property="og:type" content="website" />
    <title>Orbit — Plan. Track. Ship.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
