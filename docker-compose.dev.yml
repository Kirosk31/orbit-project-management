name: orbit

services:
  postgres:
    image: postgres:16-alpine
    container_name: orbit-postgres
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - '5432:5432'
    volumes:
      - orbit_pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-test-database.sql:/docker-entrypoint-initdb.d/10-orbit-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orbit-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - orbit_redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orbit_pgdata:
  orbit_redisdata:
